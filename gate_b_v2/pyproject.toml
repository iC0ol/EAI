[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gate-b-v2"
version = "0.1.0"
description = "Reproducible Gate B harness for Square-MH Diffusion Policy horizon and clearance experiments"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
gate-b = "gate_b_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
