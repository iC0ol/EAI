[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-intervention-pilot"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "Offline finite-grid geometry diagnostics for hypothetical spatial edits"
dependencies = ["numpy", "pillow", "matplotlib", "shapely>=2.1,<3", "pandas", "pyyaml", "pytest", "tqdm"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
